version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # CodeQL's Kotlin extractor supports through 2.4.10 (CodeQL 2.26.2). Bumping past that
    # hard-fails java-kotlin analysis. Remove once CodeQL documents 2.4.20+.
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">=2.4.20"]
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        versions: [">=2.4.20"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
