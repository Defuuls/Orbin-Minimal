name: Set up JDK and Gradle
description: Temurin JDK plus gradle/actions/setup-gradle (shared pins across workflows).

inputs:
  java-version:
    description: JDK version
    required: false
    default: '17'
  gradle-version:
    description: Gradle distribution version for the action (Minimal pins the wrapper-equivalent).
    required: false
    default: '9.7.1'
  cache-disabled:
    description: Disable the Gradle action cache (use for CodeQL clean builds).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      with:
        gradle-version: ${{ inputs.gradle-version }}
        cache-disabled: ${{ inputs.cache-disabled }}
