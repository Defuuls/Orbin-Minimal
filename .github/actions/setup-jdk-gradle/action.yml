name: Set up JDK and Gradle
description: Temurin JDK plus gradle/actions/setup-gradle (shared pins across workflows).

inputs:
  java-version:
    description: JDK version
    required: false
    default: '17'
  gradle-version:
    description: Gradle distribution version for the action (Minimal pins the wrapper-equivalent).
    required: false
    default: '9.7.1'

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: ${{ inputs.gradle-version }}
