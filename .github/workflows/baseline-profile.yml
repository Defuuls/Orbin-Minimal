name: Baseline profile

# Records a baseline profile on an emulator and opens a PR with the result.
# Not on every push: each run boots an emulator plus a release-shaped build.
# Re-record when startup or the feed changes shape; monthly cadence fights rot.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 1 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate baseline profile
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record profile
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # assembleDebug first so AGP creates debug.keystore for nonMinifiedRelease signing.
          script: adb root; gradle :app:assembleDebug --stacktrace && gradle :app:generateReleaseBaselineProfile --stacktrace

      - name: Show what was generated
        run: |
          find app/src/release/generated -name '*.txt' -print -exec wc -l {} \; || true

      - name: Upload the recorded profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseline-profile
          path: app/src/release/generated/**
          if-no-files-found: error

      - name: Open a pull request with the profile
        id: profile_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: bot/baseline-profile-generated
          add-paths: app/src/release/generated/**
          commit-message: |
            Record a baseline profile

            Generated by the Baseline profile workflow on an API 35 emulator.
          title: Record a baseline profile
          body: |
            Generated by the **Baseline profile** workflow on a rooted API 35 `google_apis`
            emulator, covering Minimal startup and the followed-boards feed.

            Re-record this when startup or the feed changes shape. A stale profile is not harmful,
            only progressively less useful.
          draft: true

      - name: Explain a failed pull request
        if: steps.profile_pr.outcome != 'success'
        run: |
          echo "::warning::Could not open a pull request with the profile. Enable" \
            "'Allow GitHub Actions to create and approve pull requests' in Settings -> Actions ->" \
            "General, or download the 'baseline-profile' artifact from this run and commit it by hand."
