name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
      - name: Lint debug build
        run: gradle :app:lintDebug --stacktrace
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      # R8 release builds belong to release.yml / auto-release; keep a main-only smoke here.
      - name: Build release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gradle :app:assembleRelease --stacktrace
      # Advice-only: first clean tree usually has unused-dep noise; do not block merge.
      - name: Dependency analysis (buildHealth)
        continue-on-error: true
        run: gradle buildHealth --stacktrace

      - name: Upload buildHealth report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-health-report
          path: |
            build/reports/dependency-analysis/**
            **/build/reports/dependency-analysis/**
          if-no-files-found: ignore
