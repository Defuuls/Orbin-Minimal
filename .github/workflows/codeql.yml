name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly Monday — staggered from Orbin's 24 8 * * 1.
    - cron: '42 9 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-java-kotlin:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jdk-gradle
        with:
          cache-disabled: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Wrapper is gitignored; CI installs Gradle via the setup action.
      # Keep Kotlin at 2.4.10 — CodeQL's extractor supports through 2.4.10 only
      # (CodeQL 2.26.2+). Bumping past that hard-fails this job.
      - name: Build Android project
        run: gradle clean :app:assembleDebug --no-daemon --no-build-cache -Dorg.gradle.caching=false --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions
